<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<title>局域网电脑遥控器</title>
<style>
*{
  box-sizing: border-box;
  font-family: system-ui;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
body{padding:16px;max-width:700px;margin:0 auto;background:#1a1a1a;color:#fff;}
.group{margin-bottom:20px;padding:12px;border:1px solid #444;border-radius:10px;}
.group h4{margin:0 0 10px 0;color:#8cf;}
button{
  padding:14px 10px;
  margin:4px;
  min-width:52px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#3377dd;
  color:white;
  touch-action: manipulation;
}
button:active{background:#2255aa;}
.input-area{
  display:flex;
  gap:8px;
  margin:8px 0;
}
#textInput,#customKeyInput{
  flex:1;
  padding:12px;
  font-size:16px;
  border-radius:8px;
  border:none;
  -webkit-user-select: auto;
  user-select: auto;
}
.btn-send-text{
  background:#28a745;
}
.combo-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:8px 0;
}
.combo-row label{
  display:flex;
  align-items:center;
  gap:4px;
}
.btn-combo-run{
  background:#dd7722;
}
.tip{
  padding:10px;
  border-radius:8px;
  margin-bottom:16px;
  text-align:center;
}
.tip-ok{
  background:#1b4426;
  color:#8f8;
  border:1px solid #3a6b47;
}
.tip-err{
  background:#502020;
  color:#f88;
  border:1px solid #773333;
}
</style>
<script>
// ========== 路径判断配置 ==========
const targetUrl = "https://dxiangwiki.github.io/keymouseHelper/tar.html";
// 解析当前目录下 tar.html 的真实绝对地址
const resolveUrl = new URL("tar.html", window.location.href).href;
const pathIsGithub = resolveUrl === targetUrl;
const isFileProtocol = window.location.protocol === "file:";

// pathValid：true=允许发送指令
const pathValid = !pathIsGithub && !isFileProtocol;
</script>
</head>
<body>
<h2>🎮 电脑遥控器</h2>
<script>
if(isFileProtocol){
  document.write(`<div class="tip tip-err">❌ 禁止：直接本地文件打开，请用 node server.js 启动服务访问</div>`);
}else if(pathIsGithub){
  document.write(`<div class="tip tip-err">❌ 禁止：Github Pages 环境，不能控制</div>`);
}else{
  document.write(`<div class="tip tip-ok">✅ 校验通过，可以正常控制</div>`);
}
</script>

<div class="group">
  <h4>⚙️ 自定义快捷键（自由组合）</h4>
  <div class="combo-row">
    <label><input type="checkbox" value="control"> Ctrl</label>
    <label><input type="checkbox" value="alt"> Alt</label>
    <label><input type="checkbox" value="shift"> Shift</label>
    <label><input type="checkbox" value="command"> Win</label>
  </div>
  <div class="input-area">
    <input id="customKeyInput" placeholder="输入按键，例如：esc、s、tab、delete、f5">
    <button class="btn-combo-run" onclick="runCustomCombo()">执行快捷键</button>
  </div>
</div>

<div class="group">
  <h4>✍️ 文字输入（手机打字发到电脑）</h4>
  <div class="input-area">
    <input type="text" id="textInput" placeholder="在这里输入文字，发送到电脑">
    <button class="btn-send-text" onclick="sendText()">发送</button>
  </div>
</div>

<div class="group">
  <h4>🔢 数字键盘 0-9</h4>
  <button onclick="sendKey('0')">0</button>
  <button onclick="sendKey('1')">1</button>
  <button onclick="sendKey('2')">2</button>
  <button onclick="sendKey('3')">3</button>
  <button onclick="sendKey('4')">4</button>
  <button onclick="sendKey('5')">5</button>
  <button onclick="sendKey('6')">6</button>
  <button onclick="sendKey('7')">7</button>
  <button onclick="sendKey('8')">8</button>
  <button onclick="sendKey('9')">9</button>
</div>

<div class="group">
  <h4>🔤 字母键盘 A-Z</h4>
  <button onclick="sendKey('a')">A</button>
  <button onclick="sendKey('b')">B</button>
  <button onclick="sendKey('c')">C</button>
  <button onclick="sendKey('d')">D</button>
  <button onclick="sendKey('e')">E</button>
  <button onclick="sendKey('f')">F</button>
  <button onclick="sendKey('g')">G</button>
  <button onclick="sendKey('h')">H</button>
  <button onclick="sendKey('i')">I</button>
  <button onclick="sendKey('j')">J</button>
  <button onclick="sendKey('k')">K</button>
  <button onclick="sendKey('l')">L</button>
  <button onclick="sendKey('m')">M</button>
  <br>
  <button onclick="sendKey('n')">N</button>
  <button onclick="sendKey('o')">O</button>
  <button onclick="sendKey('p')">P</button>
  <button onclick="sendKey('q')">Q</button>
  <button onclick="sendKey('r')">R</button>
  <button onclick="sendKey('s')">S</button>
  <button onclick="sendKey('t')">T</button>
  <button onclick="sendKey('u')">U</button>
  <button onclick="sendKey('v')">V</button>
  <button onclick="sendKey('w')">W</button>
  <button onclick="sendKey('x')">X</button>
  <button onclick="sendKey('y')">Y</button>
  <button onclick="sendKey('z')">Z</button>
</div>

<div class="group">
  <h4>🖱️ 鼠标控制</h4>
  <button onclick="mouseMove(0,-30)">鼠标↑</button>
  <button onclick="mouseMove(0,30)">鼠标↓</button>
  <button onclick="mouseMove(-30,0)">鼠标←</button>
  <button onclick="mouseMove(30,0)">鼠标→</button>
  <br>
  <button onclick="mouseClick('left')">左键点击</button>
  <button onclick="mouseClick('right')">右键点击</button>
  <button onclick="mouseScroll(1)">滚轮↑</button>
  <button onclick="mouseScroll(-1)">滚轮↓</button>
</div>

<div class="group">
  <h4>方向键</h4>
  <button onclick="sendKey('up')">↑</button>
  <button onclick="sendKey('down')">↓</button>
  <button onclick="sendKey('left')">←</button>
  <button onclick="sendKey('right')">→</button>
</div>

<div class="group">
  <h4>编辑按键</h4>
  <button onclick="sendKey('enter')">回车</button>
  <button onclick="sendKey('space')">空格</button>
  <button onclick="sendKey('backspace')">退格</button>
  <button onclick="sendKey('delete')">删除</button>
  <button onclick="sendKey('tab')">Tab</button>
  <button onclick="sendKey('escape')">ESC</button>
</div>

<div class="group">
  <h4>翻页 & 定位键</h4>
  <button onclick="sendKey('home')">Home</button>
  <button onclick="sendKey('end')">End</button>
  <button onclick="sendKey('pageup')">PageUp</button>
  <button onclick="sendKey('pagedown')">PageDown</button>
  <button onclick="sendKey('printscreen')">截图PrtSc</button>
</div>

<div class="group">
  <h4>音量控制</h4>
  <button onclick="sendKey('audio_vol_up')">音量+</button>
  <button onclick="sendKey('audio_vol_down')">音量-</button>
  <button onclick="sendKey('audio_mute')">静音</button>
</div>

<div class="group">
  <h4>F功能键</h4>
  <button onclick="sendKey('f1')">F1</button>
  <button onclick="sendKey('f2')">F2</button>
  <button onclick="sendKey('f3')">F3</button>
  <button onclick="sendKey('f4')">F4</button>
  <button onclick="sendKey('f5')">F5</button>
  <button onclick="sendKey('f6')">F6</button>
  <button onclick="sendKey('f7')">F7</button>
  <button onclick="sendKey('f8')">F8</button>
  <button onclick="sendKey('f9')">F9</button>
  <button onclick="sendKey('f10')">F10</button>
  <button onclick="sendKey('f11')">F11</button>
  <button onclick="sendKey('f12')">F12</button>
</div>

<div class="group">
  <h4>常用快捷键（组合键）</h4>
  <button onclick="sendKey('c',['control'])">Ctrl+C 复制</button>
  <button onclick="sendKey('v',['control'])">Ctrl+V 粘贴</button>
  <button onclick="sendKey('x',['control'])">Ctrl+X 剪切</button>
  <button onclick="sendKey('a',['control'])">Ctrl+A 全选</button>
  <button onclick="sendKey('s',['control'])">Ctrl+S 保存</button>
  <button onclick="sendKey('z',['control'])">Ctrl+Z 撤销</button>
  <button onclick="sendKey('tab',['alt'])">Alt+Tab 切窗口</button>
</div>

<script>
document.addEventListener('contextmenu', e=>e.preventDefault());

async function sendKey(key, modifier=null) {
  // 校验拦截
  if(!pathValid){
    alert("❌ 环境校验失败！请确保在本地使用server.js运行，勿直接打开html或者在github pages访问");
    return;
  }
  const body = { key };
  if(modifier) body.modifier = modifier;
  await fetch('/press', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  })
}

// 自定义组合快捷键
async function runCustomCombo(){
  if(!pathValid){
    alert("❌ 校验不通过，禁止发送指令");
    return;
  }
  const key = document.getElementById('customKeyInput').value.trim();
  if(!key) return;
  // 获取勾选的修饰键
  const checks = document.querySelectorAll('.combo-row input:checked');
  const mods = Array.from(checks).map(el=>el.value);
  await sendKey(key, mods);
}

// 发送文字
async function sendText(){
  if(!pathValid){
    alert("❌ 校验不通过，禁止发送指令");
    return;
  }
  const text = document.getElementById('textInput').value;
  if(!text) return;
  await fetch('/type',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text})
  })
  document.getElementById('textInput').value = '';
}

// 鼠标移动
async function mouseMove(dx, dy){
  if(!pathValid){
    alert("❌ 校验不通过，禁止发送指令");
    return;
  }
  await fetch('/mouse/move',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({dx, dy})
  })
}

// 鼠标点击
async function mouseClick(button){
  if(!pathValid){
    alert("❌ 校验不通过，禁止发送指令");
    return;
  }
  await fetch('/mouse/click',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({button})
  })
}

// 滚轮
async function mouseScroll(delta){
  if(!pathValid){
    alert("❌ 校验不通过，禁止发送指令");
    return;
  }
  await fetch('/mouse/scroll',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({delta})
  })
}
</script>
</body>
</html>
